version: 1
name: IBM MQ single route
description: Measure delivery from QM1 to QM2 through a sender channel.
test: ibmmq
pool: distributed-mq
timeout_ms: 10000

from:
  host: ibmmq-source
  queue: MQDECK.TEST.TO.QM2

to:
  host: ibmmq-destination
  queue: MQDECK.TEST.QM2.IN
  wait_ms: 5000

message:
  type: mqdeck.test-flight
  purpose: channel-delivery
  destination: QM2

expect:
  channel: QM1.TO.QM2
  max_ms: 3000
  payload:
    type: mqdeck.test-flight
    purpose: channel-delivery
    destination: QM2
  dead_letter_queue: MQDECK.DEAD.LETTER
