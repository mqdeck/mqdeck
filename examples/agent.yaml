version: 1
agent:
  id: network-zone-a
  name: Primary datacenter Agent
  location: primary-datacenter
  timezone: UTC
  max_concurrency: 4
  # Optional. Omit to use the 60s default. Raise it for a slow queue manager.
  # command_timeout: 60s
control_plane:
  url: ${MQDECK_API_URL}
  token: ${MQDECK_AGENT_TOKEN}
  reconnect_delay: 5s
  insecure_skip_verify: false
