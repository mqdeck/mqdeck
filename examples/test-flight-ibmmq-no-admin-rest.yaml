version: 1
name: IBM MQ Test Flight without Admin REST
description: Verify a correlated local message through an IBM MQ client SVRCONN.
test: ibmmq
pool: standalone
timeout_ms: 10000

from:
  host: ibmmq-standalone
  queue: MQDECK.TEST.LOCAL

to:
  host: ibmmq-standalone
  queue: MQDECK.TEST.LOCAL
  wait_ms: 5000

message:
  type: mqdeck.test-flight
  purpose: svrconn-loopback
  queue_manager: QM1

# A sender-channel assertion is intentionally absent because this is a local
# loopback. Dead-letter depth is observed through read-only MQSC over SVRCONN.
expect:
  max_ms: 1500
  payload:
    type: mqdeck.test-flight
    purpose: svrconn-loopback
    queue_manager: QM1
  dead_letter_queue: MQDECK.DEAD.LETTER
