global:
  imageRegistry: ghcr.io/mqdeck
  imagePullSecrets: []
  elasticsearch:
    url: http://elasticsearch:9200
    hostsIndex: mqdeck-hosts
    dataIndex: mqdeck-data
    timeout: 10s
    existingSecret: ""

nameOverride: ""
fullnameOverride: ""

agent:
  enabled: false
  replicaCount: 1
  image:
    repository: mqdeck-agent
    tag: "1.0.5"
    pullPolicy: IfNotPresent
  existingConfigMap: ""
  config: ""
  existingSecret: ""
  secretValues: {}
  service:
    enabled: false
    type: ClusterIP
    port: 8090
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

api:
  enabled: true
  replicaCount: 1
  image:
    repository: mqdeck-api
    tag: "1.0.5"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  corsOrigins: ""
  existingSecret: ""
  secretValues: {}
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

web:
  enabled: true
  replicaCount: 1
  image:
    repository: mqdeck-web
    tag: "1.0.5"
    pullPolicy: IfNotPresent
  apiURL: ""
  testRunnerURL: ""
  auth:
    username: admin
    displayName: MQDeck Operator
  existingSecret: ""
  # Add MQDECK_AUTH_PASSWORD, MQDECK_AUTH_SESSION_SECRET, and optionally
  # MQDECK_TEST_RUNNER_TOKEN here, or provide them through existingSecret.
  secretValues: {}
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: mqdeck.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

openshiftRoute:
  enabled: false
  annotations: {}
  host: ""
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
