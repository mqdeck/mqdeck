{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mqdeck.fullname" . }}-api
  labels:
    {{- include "mqdeck.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mqdeck.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "mqdeck.componentLabels" (dict "root" . "component" "api") | nindent 8 }}
        {{- with .Values.api.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.api.podAnnotations }}
      annotations: {{ toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "mqdeck.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "mqdeck.image" (dict "root" . "image" .Values.api.image) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: MQDECK_API_ADDRESS
              value: ":8080"
            - name: MQDECK_ELASTICSEARCH_URL
              value: {{ .Values.global.elasticsearch.url | quote }}
            - name: MQDECK_HOSTS_INDEX
              value: {{ .Values.global.elasticsearch.hostsIndex | quote }}
            - name: MQDECK_EVIDENCE_INDEX_PREFIX
              value: {{ .Values.global.elasticsearch.evidenceIndexPrefix | quote }}
            - name: MQDECK_ELASTICSEARCH_TIMEOUT
              value: {{ .Values.global.elasticsearch.timeout | quote }}
            - name: MQDECK_CORS_ORIGINS
              value: {{ .Values.api.corsOrigins | quote }}
          {{- if or .Values.api.existingSecret .Values.api.secretValues .Values.global.elasticsearch.existingSecret }}
          envFrom:
            {{- if or .Values.api.existingSecret .Values.api.secretValues }}
            - secretRef:
                name: {{ default (printf "%s-api" (include "mqdeck.fullname" .)) .Values.api.existingSecret }}
            {{- end }}
            {{- with .Values.global.elasticsearch.existingSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources: {{ toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      nodeSelector: {{ toYaml .Values.api.nodeSelector | nindent 8 }}
      affinity: {{ toYaml .Values.api.affinity | nindent 8 }}
      tolerations: {{ toYaml .Values.api.tolerations | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mqdeck.fullname" . }}-api
  labels:
    {{- include "mqdeck.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "mqdeck.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
{{- end }}
