{{- if and .Values.worker.enabled (not .Values.worker.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mqdeck.fullname" . }}-worker
  labels:
    {{- include "mqdeck.componentLabels" (dict "root" . "component" "worker") | nindent 4 }}
data:
  worker.properties: |
{{ required "worker.config is required when worker.enabled=true and worker.existingConfigMap is empty" .Values.worker.config | nindent 4 }}
{{- end }}
