{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mqdeck.fullname" . }}-web
  labels:
    {{- include "mqdeck.componentLabels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mqdeck.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "mqdeck.componentLabels" (dict "root" . "component" "web") | nindent 8 }}
        {{- with .Values.web.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.web.podAnnotations }}
      annotations: {{ toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "mqdeck.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "mqdeck.image" (dict "root" . "image" .Values.web.image) | quote }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: MQDECK_API_URL
              value: {{ default (printf "http://%s-api:%v" (include "mqdeck.fullname" .) .Values.api.service.port) .Values.web.apiURL | quote }}
            {{- with .Values.web.testRunnerURL }}
            - name: MQDECK_TEST_RUNNER_URL
              value: {{ . | quote }}
            {{- end }}
          {{- if or .Values.web.existingSecret .Values.web.secretValues }}
          envFrom:
            - secretRef:
                name: {{ default (printf "%s-web" (include "mqdeck.fullname" .)) .Values.web.existingSecret }}
          {{- end }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources: {{ toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      nodeSelector: {{ toYaml .Values.web.nodeSelector | nindent 8 }}
      affinity: {{ toYaml .Values.web.affinity | nindent 8 }}
      tolerations: {{ toYaml .Values.web.tolerations | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mqdeck.fullname" . }}-web
  labels:
    {{- include "mqdeck.componentLabels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "mqdeck.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
{{- end }}
