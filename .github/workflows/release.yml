name: Publish MQDeck release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve latest component releases
        id: components
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MQDECK_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo 'MQDECK_RELEASE_TOKEN is required' >&2; exit 1; }
          for component in api worker web; do
            tag="$(gh release list --repo "mqdeck/mqdeck-$component" --limit 1 --json tagName --jq '.[0].tagName')"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Invalid or missing $component release: $tag" >&2
              exit 1
            }
            echo "${component}_tag=$tag" >> "$GITHUB_OUTPUT"
            echo "${component}_version=${tag#v}" >> "$GITHUB_OUTPUT"
          done

      - name: Download component packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MQDECK_RELEASE_TOKEN }}
          API_TAG: ${{ steps.components.outputs.api_tag }}
          WORKER_TAG: ${{ steps.components.outputs.worker_tag }}
          WEB_TAG: ${{ steps.components.outputs.web_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for component in api worker web; do
            case "$component" in
              api) tag="$API_TAG" ;;
              worker) tag="$WORKER_TAG" ;;
              web) tag="$WEB_TAG" ;;
            esac
            tmp="$(mktemp -d)"
            gh release download "$tag" \
              --repo "mqdeck/mqdeck-$component" \
              --pattern "mqdeck-${component}_*" \
              --dir "$tmp"
            find "$tmp" -maxdepth 1 -type f -print -quit | grep -q . || {
              echo "No packages for $component" >&2
              exit 1
            }
            cp "$tmp"/* dist/
          done

      - name: Generate release manifest and checksums
        shell: bash
        env:
          MQDECK_VERSION: ${{ steps.release.outputs.version }}
          API_VERSION: ${{ steps.components.outputs.api_version }}
          WORKER_VERSION: ${{ steps.components.outputs.worker_version }}
          WEB_VERSION: ${{ steps.components.outputs.web_version }}
        run: |
          set -euo pipefail
          cat > COMPONENTS.md <<MANIFEST
          # MQDeck ${MQDECK_VERSION}

          Components included in this release:

          - API: ${API_VERSION}
          - Worker: ${WORKER_VERSION}
          - Web: ${WEB_VERSION}

          Release tag: v${MQDECK_VERSION}
          MANIFEST
          cp COMPONENTS.md dist/
          (
            cd dist
            find . -maxdepth 1 -type f ! -name BUNDLE_SHA256SUMS -printf '%f\n' \
              | sort | xargs -r sha256sum > BUNDLE_SHA256SUMS
          )

      - name: Publish MQDeck release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
              --title "MQDeck ${VERSION}" --notes-file COMPONENTS.md
          else
            gh release create "v${VERSION}" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "MQDeck ${VERSION}" --notes-file COMPONENTS.md
          fi

      - name: Checkout current main for documentation and site update
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C release-publish origin/main

      - name: Update documentation and site versions
        shell: bash
        env:
          MQDECK_VERSION: ${{ steps.release.outputs.version }}
          API_VERSION: ${{ steps.components.outputs.api_version }}
          WORKER_VERSION: ${{ steps.components.outputs.worker_version }}
          WEB_VERSION: ${{ steps.components.outputs.web_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ['MQDECK_VERSION']
          versions = {key: os.environ[f'{key}_VERSION'] for key in ('API', 'WORKER', 'WEB')}

          # Preserve the existing version-marker convention used by docs.
          for folder, patterns in ((Path('docs'), ('*.md',)), (Path('site'), ('*.html',))):
              for pattern in patterns:
                  for path in folder.rglob(pattern):
                      text = path.read_text()
                      original = text
                      for marker, value in [('MQDECK_VERSION', version),
                                            ('MQDECK_API_VERSION', versions['API']),
                                            ('MQDECK_WORKER_VERSION', versions['WORKER']),
                                            ('MQDECK_WEB_VERSION', versions['WEB'])]:
                          shell_var = 'MQDECK_VERSION' if marker == 'MQDECK_VERSION' else marker.removeprefix('MQDECK_')
                          text = re.sub(r'(' + re.escape(shell_var) + r'=)[^\s]+(\s+# ' + marker + r')',
                                        lambda m: m[1] + value + m[2], text)
                          text = re.sub(r'(\$' + ('Mqdeck' if marker == 'MQDECK_VERSION' else marker.removeprefix('MQDECK_').title()) +
                                        r'Version = ")[^"]+(" # ' + marker + r')',
                                        lambda m: m[1] + value + m[2], text)
                      if text != original:
                          path.write_text(text)

          # Explicitly update the landing page and its existing installation UI.
          html = Path('site/index.html')
          js = Path('site/app.js')
          if not html.is_file() or not js.is_file():
              raise SystemExit('Expected site/index.html and site/app.js')

          def replace_required(data, pattern, replacement, label):
              result, count = re.subn(pattern, lambda _m: replacement, data)
              if count < 1:
                  raise SystemExit(f'Expected site version pattern missing: {label}')
              return result

          content = html.read_text()
          content = replace_required(content, r'MQDECK \d+\.\d+\.\d+', f'MQDECK {version}', 'hero release')
          content = replace_required(content, r'releases/tag/v\d+\.\d+\.\d+', f'releases/tag/v{version}', 'download link')
          content = replace_required(content, r'Download v\d+\.\d+\.\d+', f'Download v{version}', 'download label')
          content = replace_required(content, r'Public release v\d+\.\d+\.\d+', f'Public release v{version}', 'terminal note')
          content = re.sub(r'(/ v)\d+\.\d+\.\d+(</span>)', lambda m: m[1] + versions['API'] + m[2], content)
          html.write_text(content)

          content = js.read_text()
          content = replace_required(content,
              r'const versions = \{ API: "[^"]+", Worker: "[^"]+", Web: "[^"]+" \};',
              f'const versions = {{ API: "{versions["API"]}", Worker: "{versions["WORKER"]}", Web: "{versions["WEB"]}" }};',
              'component versions')
          content = replace_required(content, r'MQDECK_VERSION=\d+\.\d+\.\d+',
              f'MQDECK_VERSION={version}', 'install commands')
          content = replace_required(content, r'Public release v\d+\.\d+\.\d+',
              f'Public release v{version}', 'terminal copy message')
          js.write_text(content)

          # Fail the workflow if the published version is not reflected in key areas.
          assert f'MQDECK {version}' in html.read_text()
          assert f'releases/tag/v{version}' in html.read_text()
          assert f'MQDECK_VERSION={version}' in js.read_text()
          for component, component_version in versions.items():
              assert component_version in js.read_text()
          print(f'Site updated: MQDeck {version}, components {versions}')
          PY

      - name: Commit site and documentation updates to main
        id: commit_updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ site/
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Documentation and site already up to date'
          else
            git commit -m "Update docs and site for MQDeck v${{ steps.release.outputs.version }}"
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy website through existing Pages workflow
        if: steps.commit_updates.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A push made with GITHUB_TOKEN will not normally trigger on:push workflows.
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Cleanup old workflow runs
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current_run="$GITHUB_RUN_ID"
          mapfile -t runs < <(
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$GITHUB_WORKFLOW" \
              --limit 100 --json databaseId,createdAt \
              --jq 'sort_by(.createdAt) | reverse | .[].databaseId'
          )
          count=0
          for run_id in "${runs[@]}"; do
            [[ -n "$run_id" ]] || continue
            count=$((count + 1))
            (( count <= 2 )) && continue
            [[ "$run_id" == "$current_run" ]] && continue
            gh run delete "$run_id" --repo "$GITHUB_REPOSITORY" || true
          done
