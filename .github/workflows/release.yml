name: Publish MQDeck release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve latest component releases
        id: components
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MQDECK_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo 'MQDECK_RELEASE_TOKEN is required' >&2; exit 1; }
          for component in api worker web; do
            tag="$(gh release list --repo "mqdeck/mqdeck-$component" --limit 1 --json tagName --jq '.[0].tagName')"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Invalid or missing $component release: $tag" >&2
              exit 1
            }
            echo "${component}_tag=$tag" >> "$GITHUB_OUTPUT"
            echo "${component}_version=${tag#v}" >> "$GITHUB_OUTPUT"
          done

      - name: Download component packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MQDECK_RELEASE_TOKEN }}
          API_TAG: ${{ steps.components.outputs.api_tag }}
          WORKER_TAG: ${{ steps.components.outputs.worker_tag }}
          WEB_TAG: ${{ steps.components.outputs.web_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for component in api worker web; do
            case "$component" in
              api) tag="$API_TAG" ;;
              worker) tag="$WORKER_TAG" ;;
              web) tag="$WEB_TAG" ;;
            esac
            tmp="$(mktemp -d)"
            gh release download "$tag" \
              --repo "mqdeck/mqdeck-$component" \
              --pattern "mqdeck-${component}_*" \
              --dir "$tmp"
            find "$tmp" -maxdepth 1 -type f -print -quit | grep -q . || {
              echo "No packages for $component" >&2
              exit 1
            }
            cp "$tmp"/* dist/
          done

      - name: Generate release manifest and checksums
        shell: bash
        env:
          MQDECK_VERSION: ${{ steps.release.outputs.version }}
          API_VERSION: ${{ steps.components.outputs.api_version }}
          WORKER_VERSION: ${{ steps.components.outputs.worker_version }}
          WEB_VERSION: ${{ steps.components.outputs.web_version }}
        run: |
          set -euo pipefail
          cat > COMPONENTS.md <<MANIFEST
          # MQDeck ${MQDECK_VERSION}

          Components included in this release:

          - API: ${API_VERSION}
          - Worker: ${WORKER_VERSION}
          - Web: ${WEB_VERSION}

          Release tag: v${MQDECK_VERSION}
          MANIFEST
          cp COMPONENTS.md dist/
          (
            cd dist
            find . -maxdepth 1 -type f ! -name BUNDLE_SHA256SUMS -printf '%f\n' \
              | sort | xargs -r sha256sum > BUNDLE_SHA256SUMS
          )

      - name: Publish MQDeck release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
              --title "MQDeck ${VERSION}" --notes-file COMPONENTS.md
          else
            gh release create "v${VERSION}" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "MQDeck ${VERSION}" --notes-file COMPONENTS.md
          fi

      - name: Checkout current main for documentation and site update
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C release-publish origin/main

      - name: Update documentation and site versions
        shell: bash
        env:
          MQDECK_VERSION: ${{ steps.release.outputs.version }}
          API_VERSION: ${{ steps.components.outputs.api_version }}
          WORKER_VERSION: ${{ steps.components.outputs.worker_version }}
          WEB_VERSION: ${{ steps.components.outputs.web_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["MQDECK_VERSION"]
          components = {k: os.environ[f"{k}_VERSION"] for k in ("API", "WORKER", "WEB")}
          semver = r"\d+\.\d+\.\d+"
          for value in (version, *components.values()):
              if not re.fullmatch(semver, value):
                  raise SystemExit(f"Invalid release/component version: {value}")


          def required(text: str, pattern: str, value: str, label: str) -> str:
              updated, count = re.subn(pattern, lambda _: value, text)
              if not count:
                  raise SystemExit(f"Cannot find required version marker: {label}")
              return updated


          # Preserve existing inline version-marker replacement rules in documentation.
          for folder, pattern in ((Path("docs"), "*.md"), (Path("site"), "*.html")):
              for path in folder.rglob(pattern):
                  content = path.read_text(encoding="utf-8")
                  before = content
                  for marker, value in (
                      ("MQDECK_VERSION", version),
                      ("MQDECK_API_VERSION", components["API"]),
                      ("MQDECK_WORKER_VERSION", components["WORKER"]),
                      ("MQDECK_WEB_VERSION", components["WEB"]),
                  ):
                      shell_name = "MQDECK_VERSION" if marker == "MQDECK_VERSION" else marker.removeprefix("MQDECK_")
                      pattern_shell = rf"({re.escape(shell_name)}=)[^\s]+(\s+# {marker})"
                      content = re.sub(pattern_shell, lambda m: m[1] + value + m[2], content)
                      ps_var = "Mqdeck" if marker == "MQDECK_VERSION" else marker.removeprefix("MQDECK_").title()
                      pattern_ps = rf'(\${ps_var}Version = ")[^"]+(" # {marker})'
                      content = re.sub(pattern_ps, lambda m: m[1] + value + m[2], content)
                  if content != before:
                      path.write_text(content, encoding="utf-8")

          html_path = Path("site/index.html")
          js_path = Path("site/app.js")
          if not html_path.exists() or not js_path.exists():
              raise SystemExit("site/index.html or site/app.js missing")

          html = html_path.read_text(encoding="utf-8")
          html = required(html, rf"MQDECK {semver}", f"MQDECK {version}", "hero version")
          html = required(html, rf"releases/tag/v{semver}", f"releases/tag/v{version}", "download URL")
          html = required(html, rf"Download v{semver}", f"Download v{version}", "download label")
          html = required(html, rf"Public release v{semver}", f"Public release v{version}", "terminal note")
          html = required(html, rf'(API on RHEL <span> / v){semver}(</span>)',
                          f'API on RHEL <span> / v{components["API"]}</span>', "API terminal label")
          # Script uses client side rendering; also ensure static HTML fallback is current.
          html_path.write_text(html, encoding="utf-8")

          js = js_path.read_text(encoding="utf-8")
          js = required(js, r'const versions = \{ API: "[^"]+", Worker: "[^"]+", Web: "[^"]+" \};',
                        f'const versions = {{ API: "{components["API"]}", Worker: "{components["WORKER"]}", Web: "{components["WEB"]}" }};',
                        "component versions")
          js = required(js, rf'MQDECK_VERSION={semver}', f'MQDECK_VERSION={version}', "install script")
          js = required(js, rf'Public release v{semver}', f'Public release v{version}', "runtime note")
          js_path.write_text(js, encoding="utf-8")

          # Validation is strict: release link, static fallback, JS installation variables, dynamic labels.
          assert f"MQDECK {version}" in html
          assert f"Download v{version}" in html
          assert f"releases/tag/v{version}" in html
          assert f"Public release v{version}" in html
          assert f"API on RHEL <span> / v{components['API']}</span>" in html
          assert f"MQDECK_VERSION={version}" in js
          assert f"Public release v{version}" in js
          for name, value in components.items():
              assert f'{('API' if name == 'API' else name.title())}: "{value}"' in js, (name,value,js)
          print(f"Updated site for MQDeck {version} / " + ", ".join(f"{k} {v}" for k, v in components.items()))
          PY

      - name: Commit site and documentation updates to main
        id: commit_updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ site/
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Documentation and site already up to date'
          else
            git commit -m "Update docs and site for MQDeck v${{ steps.release.outputs.version }}"
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy website through existing Pages workflow
        if: steps.commit_updates.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A push made with GITHUB_TOKEN will not normally trigger on:push workflows.
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Cleanup old workflow runs
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current_run="$GITHUB_RUN_ID"
          mapfile -t runs < <(
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$GITHUB_WORKFLOW" \
              --limit 100 --json databaseId,createdAt \
              --jq 'sort_by(.createdAt) | reverse | .[].databaseId'
          )
          count=0
          for run_id in "${runs[@]}"; do
            [[ -n "$run_id" ]] || continue
            count=$((count + 1))
            (( count <= 2 )) && continue
            [[ "$run_id" == "$current_run" ]] && continue
            gh run delete "$run_id" --repo "$GITHUB_REPOSITORY" || true
          done
