name: Release Helm chart

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without a leading v
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.13.1
      - name: Resolve version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be a semantic version without a leading v." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Lint and package
        run: |
          helm lint charts/mqdeck
          helm package charts/mqdeck \
            --version "${{ steps.release.outputs.version }}" \
            --app-version "${{ steps.release.outputs.version }}" \
            --destination dist
      - name: Sign in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin
      - name: Publish chart
        run: |
          helm push "dist/mqdeck-${{ steps.release.outputs.version }}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"
