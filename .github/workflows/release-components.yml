name: Publish component bundle

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Bundle tag, for example components-2026.10.01-1
        required: true
        type: string
      api_version:
        description: Existing API release version to include; blank skips API
        required: false
        type: string
      agent_version:
        description: Existing Agent release version to include; blank skips Agent
        required: false
        type: string
      web_version:
        description: Existing Web release version to include; blank skips Web
        required: false
        type: string

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate selection
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          API_VERSION: ${{ inputs.api_version }}
          AGENT_VERSION: ${{ inputs.agent_version }}
          WEB_VERSION: ${{ inputs.web_version }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "Invalid bundle tag" >&2; exit 1; }
          [[ -n "${API_VERSION}${AGENT_VERSION}${WEB_VERSION}" ]] || { echo "Select at least one component" >&2; exit 1; }
          for version in "${API_VERSION}" "${AGENT_VERSION}" "${WEB_VERSION}"; do
            [[ -z "${version}" || "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid component version: ${version}" >&2; exit 1; }
          done
      - name: Download selected component releases
        shell: bash
        env:
          API_VERSION: ${{ inputs.api_version }}
          AGENT_VERSION: ${{ inputs.agent_version }}
          WEB_VERSION: ${{ inputs.web_version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          download() {
            local repository="$1" version="$2" prefix="$3" metadata count=0
            [[ -n "${version}" ]] || return 0
            metadata="$(curl -fsSL "https://api.github.com/repos/mqdeck/${repository}/releases/tags/v${version}")"
            while IFS=$'\t' read -r name url; do
              [[ -n "${name}" && -n "${url}" ]] || continue
              curl -fsSL --retry 3 --output "dist/${name}" "${url}"
              count=$((count + 1))
            done < <(jq -r --arg prefix "${prefix}" '.assets[] | select(.name | startswith($prefix)) | [.name, .browser_download_url] | @tsv' <<<"${metadata}")
            [[ ${count} -gt 0 ]] || { echo "No ${repository} ${version} assets found" >&2; exit 1; }
          }
          download mqdeck-api "${API_VERSION}" 'mqdeck-api_'
          download mqdeck-agent "${AGENT_VERSION}" 'mqdeck-agent_'
          download mqdeck-web "${WEB_VERSION}" 'mqdeck-web_'
          (cd dist && sha256sum mqdeck-* | sort -k 2 > BUNDLE_SHA256SUMS)
      - name: Build release manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          API_VERSION: ${{ inputs.api_version }}
          AGENT_VERSION: ${{ inputs.agent_version }}
          WEB_VERSION: ${{ inputs.web_version }}
        run: |
          {
            echo "# MQDeck component bundle ${RELEASE_TAG}"
            echo
            echo "This bundle intentionally contains only the selected independently versioned components."
            echo
            [[ -z "${API_VERSION}" ]] || echo "- API: ${API_VERSION}"
            [[ -z "${AGENT_VERSION}" ]] || echo "- Agent: ${AGENT_VERSION}"
            [[ -z "${WEB_VERSION}" ]] || echo "- Web: ${WEB_VERSION}"
            echo
            echo "Components not listed above are not part of this release and do not need to be upgraded."
          } > COMPONENTS.md
          cp COMPONENTS.md dist/
      - name: Publish bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --notes-file COMPONENTS.md
          else
            gh release create "${RELEASE_TAG}" dist/* --repo "${GITHUB_REPOSITORY}" \
              --title "MQDeck component bundle ${RELEASE_TAG}" --notes-file COMPONENTS.md
          fi
